<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" width="320" height="48">
  <defs>
    <!-- Gemini Gradient -->
    <linearGradient id="gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E75F6" />
      <stop offset="50%" stop-color="#9B72CB" />
      <stop offset="100%" stop-color="#F26E86" />
    </linearGradient>

    <!-- Antigravity Gradient -->
    <linearGradient id="antigravity-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Qoder Gradient -->
    <linearGradient id="qoder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- ================= 1. GOOGLE GEMINI ================= -->
  <g transform="translate(0, 0)">
    <rect width="48" height="48" rx="11" fill="#1E2433" />
    <!-- Gemini Star Sparkle -->
    <path d="M24 8 C24 16.8 31.2 24 40 24 C31.2 24 24 31.2 24 40 C24 31.2 16.8 24 8 24 C16.8 24 24 16.8 24 8 Z" fill="url(#gemini-grad)" />
    <circle cx="24" cy="24" r="2.5" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- ================= 2. CLAUDE (ANTHROPIC) ================= -->
  <g transform="translate(54, 0)">
    <rect width="48" height="48" rx="11" fill="#1E2433" />
    <!-- Claude Asterisk -->
    <g transform="translate(24, 24) scale(0.65)">
      <path d="M-3,-18 L3,-18 L3,-4 L15,-13 L19,-9 L7,1 L19,10 L15,14 L3,6 L3,18 L-3,18 L-3,6 L-15,14 L-19,10 L-7,1 L-19,-9 L-15,-13 L-3,-4 Z" fill="#D97706" />
      <circle cx="0" cy="0" r="4.5" fill="#F59E0B" />
    </g>
  </g>

  <!-- ================= 3. CHATGPT (OPENAI) ================= -->
  <g transform="translate(108, 0)">
    <rect width="48" height="48" rx="11" fill="#10A37F" />
    <!-- ChatGPT Swirl -->
    <g transform="translate(24, 24) scale(0.65)">
      <path d="M14.5,-4.8 C14.1,-7.8 12.2,-10.3 9.4,-11.6 C7.9,-12.3 6.3,-12.6 4.7,-12.5 C4.3,-14.8 2.8,-16.7 0.7,-17.7 C-2.4,-19.1 -6.1,-18.2 -8.2,-15.5 C-9.3,-15.5 -10.5,-15.1 -11.5,-14.5 C-14.3,-12.8 -15.8,-9.6 -15.1,-6.3 C-16.7,-5 -17.5,-2.9 -17.2,-0.8 C-16.8,2.3 -14.9,4.8 -12.1,6.1 C-12,7.3 -11.5,8.4 -10.8,9.4 C-9,12 -5.9,13.3 -2.8,12.7 C-2,14.6 -0.3,16.1 1.8,16.8 C4.9,17.8 8.3,16.6 10.1,13.9 C11.3,13.9 12.5,13.5 13.5,12.8 C16.1,11 17.4,7.8 16.6,4.7 C18,3.2 18.6,1.1 18.2,-1 C17.8,-3 16.4,-4.3 14.5,-4.8 Z" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
    </g>
  </g>

  <!-- ================= 4. GOOGLE ANTIGRAVITY ================= -->
  <g transform="translate(162, 0)">
    <rect width="48" height="48" rx="11" fill="#1E2433" />
    <!-- Google Multi-Colored G / AGY Core Orb -->
    <g transform="translate(24, 24) scale(0.72)">
      <!-- Outer Rotating Rings -->
      <circle cx="0" cy="0" r="14" fill="none" stroke="url(#antigravity-grad)" stroke-width="2.2" stroke-dasharray="8 4" />
      <!-- Inverted Gravity Chevron -->
      <path d="M-8,5 L0,-5 L8,5" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-5,9 L0,2 L5,9" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    </g>
  </g>

  <!-- ================= 5. CURSOR ================= -->
  <g transform="translate(216, 0)">
    <rect width="48" height="48" rx="11" fill="#000000" stroke="#334155" stroke-width="1.2" />
    <!-- Cursor Isometric Cube -->
    <g transform="translate(24, 24) scale(0.68)">
      <!-- Top Face -->
      <polygon points="0,-14 12,-7 0,0 -12,-7" fill="#FFFFFF" opacity="0.95" />
      <!-- Left Face -->
      <polygon points="-12,-7 0,0 0,14 -12,7" fill="#94A3B8" />
      <!-- Right Face -->
      <polygon points="0,0 12,-7 12,7 0,14" fill="#CBD5E1" />
    </g>
  </g>

  <!-- ================= 6. QODER ================= -->
  <g transform="translate(270, 0)">
    <rect width="48" height="48" rx="11" fill="#1E2433" />
    <!-- Qoder Styled Logo -->
    <g transform="translate(24, 24) scale(0.68)">
      <circle cx="0" cy="-2" r="11" fill="none" stroke="url(#qoder-grad)" stroke-width="3" />
      <!-- Code Brackets inside Q -->
      <path d="M-5,-4 L-8,-2 L-5,0" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M5,-4 L8,-2 L5,0" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Q Tail -->
      <path d="M4,4 L11,11" fill="none" stroke="url(#qoder-grad)" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
